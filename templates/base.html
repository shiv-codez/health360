<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Health360{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('home') }}">Health360</a>
    <nav>
      <a href="{{ url_for('home') }}" class="{{ 'on' if request.endpoint == 'home' }}">Home</a>
      <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('story') }}" class="{{ 'on' if request.endpoint == 'story' }}">Story</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Health360: Healthcare Risk and Disease Analysis. Built with Tableau Public and Flask.</footer>
</body>
</html>
